<!DOCTYPE html>

<html>

<head>

    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    <link rel="stylesheet" href="styleSheets/day_style.css">
    <link rel="stylesheet" href="styleSheets/schedule_style.css">


</head>

<body id="body">
    <main>

        <section id=title_area>
            <h1 id="date_title"> dd. Monat yyyy:</h1>
            <p id="holiday_display">Feiertage</p>
        </section>

        <section id="note_section">
            <h3 class='post-it' id="notesTitle"> Notizen:</h3>
            <ul id="noteList">
                <li id="noteInputLine" class="noteLine">
                    <div id="noteInputDiv">
                        <textarea id="noteInputField" placeholder="Notiz hinzufügen..."></textarea>
                        <button id="addNoteButton" onclick="sendNoteWriteRequest()">+</button>
                    </div>
                </li>
            </ul>
        </section>
        <section id='new_schedule_section'>
            <h3 class='post-it' id='new_schedule_header'>Neuer Termin:</h3>
            <section id='new_schedule_wrapper'>

            </section>
        </section>

        <section id='todays_schedules'>
            <h3 class='post-it' id='schedule_header'>Termine:</h3>
            <ul id='schedule_list'>
                <li>
                    <h4>Gassi gehen</h4>
                    <ul>
                        <li>Start: __.__.__</li>
                        <li>Ende: __.__.__</li>
                        <li>Wiederholen: ______</li>
                    </ul>
                </li>
            </ul>
        </section>

        <section id='hist_section'>
            <h3 class='post-it'><span class="line-through">Hyster</span> Historische Ereignisse:</h3>
            <ul id='hist_list'></ul>
        </section>
    </main>
    <section id='day_scroll_flex'>
        <button class='day-scroll' id='to_yesterday'></button>
        <button class='day-scroll' id='to_tomorrow'></button>
    </section>

    <script src="scripts/common/fetcher.js"></script>
    <script src="scripts/common/calendarTools.js"></script>
    <script src="scripts/day_view/daily_notes.js">


    </script>
    <script src="scripts/day_view/dayView.js"></script>
    <script src="scripts/day_view/day_message_processing.js"></script>
    <script src="scripts/common/messageCenter.js"></script>

    <script src='scripts/classes/templates.js'></script>
    <script src='scripts/common/calendarSheet.js'></script>
    <script src='scripts/classes/dateSelector.js'></script>
    <script src='scripts/classes/scheduleFormular.js'></script>
</body>

</html>
