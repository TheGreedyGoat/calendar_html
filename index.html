<!DOCTYPE html>

<html>

<head>
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

    <link rel="stylesheet" href="styleSheets/style.css" />
    <title>Kalender</title>

</head>

<body>
    <!--soll sich bewegen -->
    <main>
        <section id="left_section">
            <button id="to_day_view" class="switch_view"
                onclick="handler.sendMessage(window, 'click', {clickType: 'to day view'})">
                <!-- <img src="assets/images/arrow.png" alt="Button to day view"> -->
            </button>
            <div id='window_frame'>
                <div id='window'>

                    <img id='car' src="/assets/images/window/car.png" alt="blue sports car">
                </div>
            </div>

            <div id="calendar_wrapper">
                <h3 id="calendar_head"></h3>
                <div id="calendar_target">

                    <div id="monthButtonContainer">
                        <button class="monthButton" id="lastMonth"
                            onclick="handler.sendMessage(window, 'click',{clickType: 'month scroll',clickValue: -1});"></button>
                        <button class="monthButton" id="nextMonth"
                            onclick="handler.sendMessage(window, 'click',{clickType: 'month scroll',clickValue: +1});"></button>
                    </div>
                </div>
            </div>
        </section>
        <section id='right_section'><button id="to_month_view" class="switch_view"
                onclick="handler.sendMessage(window, 'click', {clickType: 'to month view'})">
                <!-- <img src="assets/images/arrow.png" alt="Button to day view"> -->
            </button>
            <div id="frameHolder">

                <iframe src="dayView.html" id="day_view" width="100dvw" height="100%" frameborder="0"></iframe>
        </section>
        </div>
    </main>



    <script src="scripts/common/holidays.js"></script>
    <script src="scripts/common/calendarTools.js"></script>
    <script src="scripts/common/calendarSheet.js"></script>

    <script src='scripts/classes/calendarSchedule.js'></script>
    <script src="scripts/month_view/fixedHolidays.js"></script>
    <script src="scripts/month_view/swiping.js"></script>
    <script src='scripts/common/fetcher.js'></script>
    <script src="scripts/month_view/easterEggs.js"></script>
    <script src="scripts/month_view/monthView.js"></script>
    <script src="scripts/month_view/wroom.js"></script>

    <script src="scripts/month_view/month_message_processing.js"></script>
    <script src="scripts/common/messageCenter.js"></script>

    <script src="scripts/month_view/monthSetup.js"></script>
</body>

</html>
