<template id='schedule_creator_template'>
    <div id='main_div' class='schedule-main-wrapper'>
        <div id='title_wrapper' class="title-wrapper">
            <input type="text" name="schedule-title" id="title_input" class='title-input' value=''
                placeholder="Titel hinzufügen">
        </div>
        <div id='date_selector_wrapper' , class='date-selector-wrapper'>
            <div class='start'>Beginn:</div>
            <div id='start_selector_target' class='start'>Selector</div>
            <div class='end' hidden>Ende:</div>
            <div class='end' id='end_selector_target' hidden> Selector</div>
            <span>Ganztägig</span>
            <div class='check-wrapper'>
                <input type="checkbox" name="isWholeDay" id="whole_day_check">
            </div>

        </div>
        <div id='recurrence_wrapper' class="recurrence-wrapper">
            <span>Wiederholen:</span>
            <div class='check-wrapper'>
                <input type="checkbox" , id='recurrence_check'>
            </div>
            <div id='select_recurrence_wrapper'>
                alle <input type="number" id='recurrence_amount' />
                <select name="recurrencetype" id="select_recurrence_type">
                    <option value="yearly">Jahre</option>
                    <option value="monthly">Monate</option>
                    <option value="weekly">Wochen</option>
                    <option value="daily">Tage</option>
                </select>
            </div>
        </div>
        <button name='submit' , id='submit_schedule'>Hinzufügen</button>
    </div>
</template>

<template id='date_selector_template'>
    <div id='outest_wrapper'>
        <button id="showHide" class="selector-showHide" type="button"></button>
        <div id='flex_wrapper' class="selector-flexWrapper">
            <div id='selector_focus_wrapper' class='selector-focus-wrapper' hidden>
                <div id="inner_wrapper" class="selector-innerWrapper">

                    <h3 id='sheet_header'>März 2026</h3>

                    <div id="form" class="selector-form"></div>
                    <div class='month-button-wrapper'>
                        <button id="prevMonth" class="selector-month"></button>
                        <button id="nextMonth" class="selector-month next"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</template>
